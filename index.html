<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقويم محتوى موبايلي</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<style>
/* Layout: sticky toolbar, then either an agenda of day rows (cards side by side) or a month grid. Editors get controls; everyone else just reads. */
/* Apple-style light grey canvas with frosted-glass surfaces */
:root{
  --bg:#e3e5e9;
  --surface:#eef0f3;
  --glass:rgba(238,240,243,.74);
  --glass-strong:rgba(236,238,241,.92);
  --glass-border:rgba(255,255,255,.38);
  --ink:#24262b;
  --muted:#686c75;
  --line:rgba(20,25,35,.10);
  --accent:#2f5f9c;
  --accent-2:#4a78b0;
  --accent-soft:rgba(47,95,156,.10);
  --warn:#94590f;
  --warn-soft:rgba(206,160,58,.20);
  --danger:#a8322b;
  --today:#2f5f9c;
  --shadow:0 1px 1px rgba(0,0,0,.04),0 6px 22px rgba(20,25,35,.07);
  --blur:saturate(180%) blur(22px);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Arabic","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Arabic","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px}
img,video{max-width:100%;display:block}
.hidden{display:none!important}

/* toolbar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;flex-direction:column;gap:0;margin-inline-end:auto}
.brand h1{font-family:var(--f-display);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--muted);font-size:13px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav strong{font-family:var(--f-display);font-weight:600;font-size:16px;min-width:120px;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.icon-btn:hover{border-color:var(--accent)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 14px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn.danger.solid{background:var(--danger);border-color:var(--danger);color:#fff}

.summary{max-width:1280px;margin:0 auto;padding:16px 20px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;gap:8px;align-items:baseline}
.stat b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.stat.warn b{color:var(--warn)}
.filter{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}
.chk input{accent-color:var(--accent)}

main{max-width:1280px;margin:0 auto;padding:16px 20px 80px}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}

/* agenda */
.day{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:18px 0;border-top:1px solid var(--line);scroll-margin-top:90px}
.day:first-child{border-top:0}
.day-head{position:sticky;top:84px;align-self:start}
.day-head .dn{color:var(--muted);font-size:13px}
.day-head .dd{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.day-head .dm{font-size:13px;color:var(--muted)}
.day.today .dd{color:var(--today)}
.day.today .dn::after{content:" · اليوم";color:var(--today);font-weight:600}
.day-posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;min-height:60px;border-radius:14px;transition:background .15s}
.day.drop .day-posts,.cell.drop{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:4px}
.day.empty{padding:8px 0}
.day.empty .day-posts{min-height:40px}
.day.empty .dd{font-size:22px}
.day.empty .add-slot{min-height:40px}
.add-slot{border:1.5px dashed var(--line);border-radius:14px;background:none;color:var(--muted);min-height:44px;font-weight:500}
.add-slot:hover{border-color:var(--accent);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.dragging{opacity:.4}
.card[draggable="true"]{cursor:grab}
.media{position:relative;aspect-ratio:1/1;background:var(--accent-soft);cursor:zoom-in}
.media img,.media video{width:100%;height:100%;object-fit:cover}
.media .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;cursor:default}
.media .count{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;border-radius:999px;padding:1px 9px}
.time{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--ink);font-weight:600;font-size:13px;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.card.notready{background:var(--warn-soft);border-color:var(--warn);box-shadow:0 0 0 1px var(--warn),var(--shadow)}
.card.notready .tools{border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.card.notready details.plat{border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.nr{font-size:12px;font-weight:700;color:var(--warn);letter-spacing:.01em}
.card.notready .badge{background:var(--surface);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.badge{font-size:12px;border-radius:6px;padding:1px 8px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.cap{margin:0;white-space:pre-line;font-size:14px;overflow-wrap:anywhere}
.cap.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--accent);padding:0;font-size:13px;align-self:flex-start}
.links{display:flex;gap:8px;flex-wrap:wrap}
.lk{font-size:13px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:2px 10px;color:var(--ink)}
.lk:hover{border-color:var(--accent);color:var(--accent)}
details.plat{border-top:1px solid var(--line);padding-top:8px;font-size:13px}
details.plat summary{cursor:pointer;color:var(--muted)}
.plat ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.plat li{display:flex;gap:8px;align-items:center;justify-content:space-between}
.plat li span{font-weight:600;min-width:72px}
.plat li a{direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;text-align:left;font-size:12px}
.copy{border:1px solid var(--line);background:none;border-radius:6px;font-size:11px;padding:0 6px;color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.tools button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 9px;font-size:12px;font-weight:500}
.tools button:hover{border-color:var(--accent);color:var(--accent)}
.tools .del:hover{border-color:var(--danger);color:var(--danger)}
.tools .grow{margin-inline-start:auto}

/* month grid */
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:500}
.cell{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:118px;padding:6px;display:flex;flex-direction:column;gap:6px;cursor:pointer;transition:background .15s}
.cell:hover{border-color:var(--accent)}
.cell.out{background:transparent;border-style:dashed;cursor:default;opacity:.5}
.cell.today{border-color:var(--today);box-shadow:inset 0 0 0 1px var(--today)}
.cell .n{font-weight:600;font-variant-numeric:tabular-nums;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.cell .n em{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.thumbs{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}
.thumbs .t{position:relative;aspect-ratio:1/1;border-radius:6px;overflow:hidden;background:var(--accent-soft)}
.thumbs .t img,.thumbs .t video{width:100%;height:100%;object-fit:cover}
.thumbs .t.miss{outline:2px solid var(--warn);outline-offset:-2px}
.thumbs .t i{position:absolute;bottom:1px;right:3px;font-style:normal;font-size:10px;color:#fff;text-shadow:0 0 3px #000;font-weight:600}
.thumbs .t[draggable="true"]{cursor:grab}
@media (max-width:720px){
  .cell{min-height:70px;padding:4px}
  .thumbs{grid-template-columns:1fr}
  .thumbs .t:nth-child(n+3){display:none}
}
@media (max-width:640px){
  .day{grid-template-columns:1fr;gap:10px}
  .day-head{position:static;display:flex;gap:8px;align-items:baseline}
  .day-head .dd{font-size:22px}
  .top-in{padding:12px 16px}
  main,.summary{padding-inline:16px}
}

/* modal + lightbox */
.overlay{position:fixed;inset:0;background:rgba(5,10,25,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:min(680px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal h2{font-family:var(--f-display);font-size:18px;margin:0}
.modal .content{padding:18px 20px;display:grid;gap:14px}
.modal footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-start;align-items:center}
.modal footer .msg{margin-inline-start:auto;font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:5px}
.field label{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=url],.field input[type=date],.field input[type=time],.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px}
.field textarea{min-height:150px;resize:vertical;line-height:1.7}
.field input[type=url]{direction:ltr;text-align:left}
.hint{font-size:12px;color:var(--muted)}
.drop-zone{border:1.5px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;background:var(--bg)}
.drop-zone.over{border-color:var(--accent);background:var(--accent-soft)}
.mlist{display:flex;gap:8px;flex-wrap:wrap}
.mitem{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;background:var(--accent-soft)}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover}
.mitem button{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:13px;line-height:1}
.mitem .mv{position:absolute;bottom:3px;left:3px;right:3px;display:flex;justify-content:space-between}
.mitem .mv button{position:static;width:20px;height:20px;font-size:11px}
.pl summary{cursor:pointer;font-size:13px;font-weight:600}
.pl .grid5{display:grid;gap:8px;margin-top:10px}
.pl .grid5 div{display:grid;grid-template-columns:80px 1fr;gap:8px;align-items:center;font-size:13px}
.pl .grid5 label{font-weight:500}
.tp{display:grid;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
.tp-row{display:grid;grid-template-columns:56px 1fr;gap:8px;align-items:center}
.tp-l{font-size:12px;color:var(--muted)}
.tp-g{display:flex;flex-wrap:wrap;gap:6px}
.tp-g button{min-width:40px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 10px}
.tp-g button:hover{border-color:var(--accent)}
.tp-g button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tp-g.h{display:grid;grid-template-columns:repeat(4,52px)}
.tp-g.h button{width:100%}
.tp-g .tp-none{margin-inline-start:auto;font-weight:500;color:var(--muted)}
.tp-g .tp-none[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.pl input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;direction:ltr;text-align:left}
.inline-chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}

.lb{position:fixed;inset:0;z-index:60;background:rgba(4,8,20,.92);display:grid;grid-template-columns:1fr minmax(260px,380px);color:#eef1fa}
.lb .stage{display:grid;place-items:center;padding:24px;position:relative;min-height:0}
.lb .stage img,.lb .stage video{max-height:calc(100vh - 48px);max-width:100%;object-fit:contain;border-radius:8px}
.lb aside{background:#10172c;padding:24px;overflow:auto;display:grid;align-content:start;gap:12px}
.lb aside h3{margin:0;font-family:var(--f-display);font-size:16px}
.lb aside p{margin:0;white-space:pre-line;font-size:14px;line-height:1.8}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px}
.lb .nav.prev{right:16px}.lb .nav.next{left:16px}
.lb .x{position:absolute;top:14px;left:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;z-index:2}
.lb .pos{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.8}
@media (max-width:760px){.lb{grid-template-columns:1fr;grid-template-rows:60vh auto;overflow:auto}}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:14px;z-index:80;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* ---------- glass layer ---------- */
body{background:var(--bg);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 600px at 85% -10%,rgba(47,95,156,.06),transparent 60%),
             radial-gradient(700px 500px at 0% 30%,rgba(90,130,160,.05),transparent 60%),var(--bg)}
.top{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
.card,.stat,.cell:not(.out),.btn,.icon-btn,.seg,.lk,.chk{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);box-shadow:var(--shadow)}
.card{border-radius:20px}
.cell{border-radius:16px}
.stat{border-radius:14px}
.btn,.icon-btn,.seg,.chk,.lk{border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.seg button{border-radius:999px}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(47,95,156,.22)}
.btn.primary:hover{filter:brightness(1.06)}
.btn:hover,.icon-btn:hover,.lk:hover{border-color:var(--glass-border);background:var(--glass-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.media{background:rgba(0,0,0,.04)}
.time{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border)}
.tools button{background:rgba(241,242,245,.5);border:1px solid var(--line);border-radius:999px;padding:3px 11px}
.tools{border-top-color:var(--line)}
details.plat{border-top-color:var(--line)}
.add-slot{border-radius:20px;border-color:rgba(0,0,0,.12);background:rgba(241,242,245,.25)}
.day{border-top-color:var(--line)}
.overlay{background:rgba(0,0,0,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:22px}
.modal header,.modal footer{border-color:var(--line)}
.field input[type=text],.field input[type=url],.field input[type=date],.field textarea,.pl input{background:rgba(241,242,245,.7);border:1px solid var(--line);border-radius:12px}
.drop-zone,.tp{background:rgba(241,242,245,.45);border-color:var(--line);border-radius:14px}
.tp-g button{background:rgba(241,242,245,.8);border-color:var(--line);border-radius:10px}
.tp-g button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sp-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp-btn{font-size:13px;padding:5px 12px}
.sp-list{display:grid;gap:6px}
.sp-list.stale{opacity:.5}
.sp-item{border:1px solid rgba(168,50,43,.18);background:rgba(168,50,43,.06);border-radius:12px;padding:8px 10px;display:grid;gap:4px}
.sp-ctx{font-size:13px;color:var(--muted);white-space:pre-line}
.sp-ctx mark{background:none;color:var(--danger);text-decoration:underline wavy var(--danger);text-underline-offset:4px;font-weight:600}
.sp-row{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13px}
.sp-sug b{font-weight:700}
.sp-ok{border:1px solid var(--line);background:rgba(241,242,245,.85);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.dp{display:grid;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px;background:rgba(241,242,245,.45)}
.dp-head{font-size:13px;color:var(--muted);font-weight:600}
.dp-strip{display:grid;grid-template-columns:30px repeat(7,minmax(0,1fr)) 30px;gap:6px}
.dp-nav{border:1px solid var(--line);background:rgba(241,242,245,.85);border-radius:10px;font-size:16px;color:var(--muted);cursor:pointer;min-height:30px}
.dp-nav:hover{border-color:var(--accent);color:var(--accent)}
.dp-day{border:1px solid var(--line);background:rgba(241,242,245,.85);border-radius:14px;padding:7px 2px;display:grid;gap:1px;justify-items:center;cursor:pointer;color:var(--ink)}
.dp-day:hover{border-color:var(--accent)}
.dp-day .dn{font-size:11px;color:var(--muted)}
.dp-day .dx{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.dp-day.today .dx,.dp-mday.today{color:var(--accent)}
.dp-day.on,.dp-mday.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dp-day.on .dn,.dp-day.on .dx{color:#fff}
.dp-dots{display:flex;gap:3px;justify-content:center;height:5px}
.dp-dots i{width:5px;height:5px;border-radius:50%;background:var(--muted);opacity:.6;display:block}
.dp-dots.full i{background:var(--warn);opacity:1}
.on .dp-dots i{background:#fff;opacity:.9}
.dp-foot{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.dp-link{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0}
.dp-month{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.dp-mhead{display:grid;grid-template-columns:30px 1fr 30px;align-items:center;text-align:center;font-weight:600;font-size:14px}
.dp-mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dp-mgrid .wd{font-size:11px;color:var(--muted);text-align:center}
.dp-mday{border:1px solid transparent;background:rgba(241,242,245,.7);border-radius:10px;padding:5px 0 4px;display:grid;gap:2px;justify-items:center;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--ink)}
.dp-mday:hover{border-color:var(--accent)}
@media (max-width:520px){.dp-strip{grid-template-columns:24px repeat(7,minmax(0,1fr)) 24px;gap:3px}.dp-day .dn{font-size:9px}.dp-day .dx{font-size:16px}}
/* compact post cards */
.day-posts{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.day-posts .add-slot{align-self:start}
.card{border-radius:16px}
.body{padding:9px 10px;gap:7px}
.cap{font-size:12.5px;line-height:1.55}
.cap.clamp{-webkit-line-clamp:3}
.more{font-size:12px}
.time{font-size:11.5px;padding:1px 8px;top:6px;right:6px}
.lk{font-size:11.5px;padding:1px 8px}
.badge{font-size:11px;padding:0 6px}
.nr{font-size:11px}
details.plat{font-size:12px;padding-top:6px}
.tools{padding-top:7px;gap:4px}
.tools button{width:30px;height:28px}
.tools button svg{width:14px;height:14px}
.add-slot{min-height:56px}
@media (min-width:641px){.day{grid-template-columns:100px 1fr}}
/* hide/show the activity sidebar */
.feed-hide{margin-inline-start:auto;border:1px solid var(--line);background:rgba(241,242,245,.6);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.feed-hide:hover{color:var(--accent);border-color:var(--accent)}
body.feed-off .layout{grid-template-columns:minmax(0,1fr)}
body.feed-off .feed{display:none}
body.feed-off .feed-btn{display:inline-flex}
@media (max-width:1100px){.feed-hide{display:none}body.feed-off .feed{display:flex}}
.tp-pre{display:flex;flex-wrap:wrap;gap:8px}
.tp-chip{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:92px;min-height:54px;padding:6px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(241,242,245,.85);color:var(--ink);cursor:pointer;line-height:1.3}
.tp-chip b{font-size:16px;font-variant-numeric:tabular-nums}
.tp-chip small{font-size:12px;color:var(--muted)}
.tp-chip:hover{border-color:var(--accent)}
.tp-chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tp-chip[aria-pressed="true"] small{color:rgba(241,242,245,.85)}
.tp-chip.taken:not([aria-pressed="true"]){border-style:dashed;color:var(--muted)}
.tp-chip.ghost{flex-direction:row;gap:6px;min-width:auto;color:var(--muted);border-style:dashed}
.tp-chip.ghost[aria-pressed="true"]{border-style:solid;color:#fff}
.tp-cus{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line);opacity:.5;transition:opacity .15s}
.tp-cus.on{opacity:1}
.tp-cus select{border:1px solid var(--line);background:rgba(241,242,245,.85);border-radius:10px;padding:6px 10px;font-weight:600}
.tp-seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:rgba(241,242,245,.85)}
.tp-seg button{border:0;background:none;padding:6px 11px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.tp-seg button+button{border-inline-start:1px solid var(--line)}
.tp-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.layout{max-width:1600px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0 22px;padding:0 20px}
.layout .summary,.layout main{max-width:none;padding-inline:0}
.top-in{max-width:1600px}
.feed{position:sticky;top:90px;align-self:start;margin-top:16px;max-height:calc(100vh - 110px);display:flex;flex-direction:column;background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.feed-head{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.feed-head b{font-family:var(--f-display);font-size:16px}
.live{font-size:11px;color:#3d7a55;display:inline-flex;align-items:center;gap:5px}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#4c9a68;box-shadow:0 0 0 3px rgba(76,154,104,.18)}
.feed-x{display:none;margin-inline-start:auto;width:30px;height:30px}
.feed-f{display:flex;gap:5px;flex-wrap:wrap;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.feed-f button{border:1px solid var(--line);background:rgba(241,242,245,.6);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.feed-f button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.feed-list{overflow:auto;padding:6px 10px 14px;display:grid;gap:2px;align-content:start}
.feed-g{font-size:11px;color:var(--muted);padding:10px 6px 4px;font-weight:600}
.fe{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:7px 6px;border-radius:12px;cursor:pointer;text-align:start;border:0;background:none;color:inherit;width:100%}
.fe:hover{background:rgba(241,242,245,.7)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.av.m{background:rgba(47,95,156,.13);color:#2f5f9c}
.av.a{background:rgba(120,80,150,.14);color:#6f4a8c}
.av.s{background:rgba(0,0,0,.06);color:var(--muted)}
.fe>span:last-child{display:block;min-width:0}
.fe-t{display:block;font-size:13px;line-height:1.55}
.fe-t svg{vertical-align:-2px;color:var(--muted);margin-inline-end:3px}
.fe-t em{font-style:normal;color:var(--muted)}
.fe-w{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.fe.dev{background:rgba(76,154,104,.10)}
.fe.dev .fe-t svg{color:#3d7a55}
.dev-b{font-size:10.5px;color:#3d7a55;background:rgba(241,242,245,.85);border-radius:999px;padding:0 7px;margin-inline-start:4px;white-space:nowrap}
.card.flash{animation:flash 1.6s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--accent),var(--shadow)}100%{box-shadow:var(--shadow)}}
.feed-btn{display:none}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .feed{position:fixed;top:0;left:0;bottom:0;width:min(360px,92vw);max-height:none;margin:0;border-radius:0 20px 20px 0;z-index:40;transform:translateX(-105%);transition:transform .2s}
  .feed.open{transform:none}
  .feed-x{display:grid}
  .feed-btn{display:inline-flex}
}
@media (prefers-reduced-motion: reduce){.card.flash{animation:none;outline:3px solid var(--accent)}}
.tools button{width:30px;height:28px;padding:0;display:inline-grid;place-items:center}
.tools{gap:6px;flex-wrap:nowrap}
.card.notready{background:linear-gradient(var(--warn-soft),var(--warn-soft)),var(--glass);border-color:rgba(176,128,40,.55);box-shadow:0 0 0 1px rgba(176,128,40,.35),var(--shadow)}
.card.notready .badge{background:rgba(241,242,245,.75)}
.toast{background:var(--glass-strong);color:var(--ink);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:999px}
@media (prefers-reduced-transparency: reduce){.card,.stat,.cell,.btn,.icon-btn,.seg,.top,.modal{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}}
.login{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px}
.login-card{width:min(400px,100%);background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:24px;box-shadow:var(--shadow);padding:28px;display:grid;gap:14px}
.login-card h2{margin:0;font-family:var(--f-display);font-size:22px}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.login-card input{width:100%;border:1px solid var(--line);background:rgba(241,242,245,.8);border-radius:12px;padding:10px 12px;direction:ltr;text-align:left}
.login-card .btn{justify-content:center;padding:10px 14px}
.who{display:flex;gap:8px;align-items:center}
.who-pick{display:flex;gap:10px;flex-wrap:wrap}
.who-pick .btn{flex:1;justify-content:center;padding:12px 14px;font-size:15px}
.who button{border:0;background:none;color:var(--accent);font-size:13px;padding:0}
</style>

<body>
<div class="top">
  <div class="top-in">
    <div class="brand">
      <h1>تقويم محتوى موبايلي</h1>
      <small class="who"><span id="roleLine">جاري التحميل…</span><button id="whoChange" class="hidden" type="button">تغيير</button></small>
    </div>
    <div class="month-nav">
      <button class="icon-btn" id="prevM" aria-label="الشهر السابق">›</button>
      <strong id="monthLabel">—</strong>
      <button class="icon-btn" id="nextM" aria-label="الشهر التالي">‹</button>
    </div>
    <div class="seg" role="group" aria-label="طريقة العرض">
      <button id="vList" aria-pressed="true">القائمة</button>
      <button id="vMonth" aria-pressed="false">الشهر</button>
    </div>
    <button class="btn hidden feed-btn" id="feedBtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg> التحديثات</button>
    <button class="btn hidden" id="importBtn">استيراد Excel</button>
    <button class="btn hidden" id="exportBtn">تصدير Excel</button>
    <button class="btn primary hidden" id="addBtn">+ بوست جديد</button>
  </div>
</div>

<div class="layout"><div class="col-main">
<div class="summary" id="summary"></div>
<main id="main"><div class="notice">جاري تحميل البوستات…</div></main>
</div>
<aside class="feed hidden" id="feed" aria-label="آخر التحديثات">
  <div class="feed-head"><b>آخر التحديثات</b><span class="live" id="feedLive">مباشر</span><button type="button" class="feed-hide" id="feedHide" title="إخفاء السجل" aria-label="إخفاء السجل"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 6l-6 6 6 6M19 6l-6 6 6 6"/></svg> إخفاء</button><button type="button" class="icon-btn feed-x" id="feedX" aria-label="إغلاق">✕</button></div>
  <div class="feed-f" id="feedF"></div>
  <div class="feed-list" id="feedList"><div class="hint">جاري التحميل…</div></div>
</aside></div>

<div class="login hidden" id="login"><div class="login-card">
  <h2>تقويم محتوى موبايلي</h2>
  <p>مين أنت؟ عشان يطلع اسمك في سجل التحديثات.</p>
  <div class="who-pick" id="whoPick"></div>
</div></div>
<div id="modalRoot"></div>
<div id="lbRoot"></div>

<script>
(function(){
"use strict";
const DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const MONTHS=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const PRESETS=[["11:00","الصبح"],["15:00","العصر"],["19:00","المغرب"]];
const PLATS=[["X","X"],["Instagram","Instagram"],["Facebook","Facebook"],["TikTok","TikTok"],["Snapchat","Snapchat"]];

const S={posts:[],ym:null,view:"list",canEdit:false,db:null,onlyMissing:false,showEmpty:false,loaded:false,dragId:null,urls:{}};
let sb=null;
function makeClient(who){sb=window.supabase.createClient(window.MC_CONFIG.url,window.MC_CONFIG.anonKey,{auth:{persistSession:false,autoRefreshToken:false},global:{headers:{"x-actor":who||"unknown"}}})}
const BUCKET="media";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayISO=(()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())})();
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))}
function iso(dt){return dt.getUTCFullYear()+"-"+pad(dt.getUTCMonth()+1)+"-"+pad(dt.getUTCDate())}
function addDays(s,n){const d=parseISO(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function shortDate(s){const d=parseISO(s);return d.getUTCDate()+" "+MONTHS[d.getUTCMonth()]}
function dayName(s){return DAYS[parseISO(s).getUTCDay()]}
function fmtTime(t){if(!t)return "الوقت لم يحدد";const [h,m]=t.split(":").map(Number);const ap=h<12?"ص":"م";const hh=((h+11)%12)+1;return hh+":"+pad(m)+" "+ap}
function mediaUrl(m){return (m&&S.urls[m.path])||""}
async function signPaths(paths){
  const need=[...new Set(paths)].filter(p=>p&&!S.urls[p]);
  if(!need.length)return;
  const {data,error}=await sb.storage.from(BUCKET).createSignedUrls(need,60*60*12);
  if(!error&&data)data.forEach(d=>{if(d.signedUrl)S.urls[d.path]=d.signedUrl});
}
function isVideo(m){return m&&m.type==="video"}
function missing(p){
  const out=[];
  if(!(p.media&&p.media.length))out.push("بدون صورة");
  if(!p.design||!String(p.design).trim())out.push("بدون ملفات تصميم");
  if(!p.caption||!p.caption.trim())out.push("بدون كابشن");
  if(!p.time)out.push("بدون وقت");
  const have=PLATS.filter(([k])=>p.links&&String(p.links[k]||"").trim()).length;
  if(p.landing&&have<PLATS.length)out.push("بانتظار الاختصار");
  else if(!have)out.push("بدون روابط");
  return out;
}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function sortPosts(a,b){return (a.time||"99")<(b.time||"99")?-1:(a.time||"99")>(b.time||"99")?1:0}

/* ---------- data ---------- */
async function init(){
  S.ym=todayISO.slice(0,7);
  render();
  let who=null;try{who=localStorage.getItem("mc-who")}catch(e){}
  $("#whoChange").onclick=()=>{try{localStorage.removeItem("mc-who")}catch(e){}location.reload()};
  if(who&&PEOPLE[who]){start(who);return}
  $("#whoPick").innerHTML=Object.keys(PEOPLE).map(e=>'<button type="button" class="btn primary" data-e="'+esc(e)+'">أنا '+esc(PEOPLE[e].name)+'</button>').join("");
  $("#whoPick").querySelectorAll("button").forEach(b=>b.onclick=()=>{try{localStorage.setItem("mc-who",b.dataset.e)}catch(e){}start(b.dataset.e)});
  $("#login").classList.remove("hidden");$("#main").innerHTML="";$("#roleLine").textContent="";
}
async function start(who){
  if(S.started)return;S.started=true;
  makeClient(who);
  $("#login").classList.add("hidden");
  S.canEdit=true;S.db=true;S.me=who;
  $("#addBtn").classList.remove("hidden");$("#importBtn").classList.remove("hidden");$("#exportBtn").classList.remove("hidden");$("#whoChange").classList.remove("hidden");
  $("#roleLine").textContent="أهلًا "+PEOPLE[who].name;
  await loadPosts(true);
  startFeed();
  let t=null;
  sb.channel("posts-live").on("postgres_changes",{event:"*",schema:"public",table:"posts"},()=>{clearTimeout(t);t=setTimeout(()=>loadPosts(false),250)}).subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadPosts(false)});
}
async function loadPosts(first){
  const timer=first?setTimeout(()=>{if(!S.loaded)$("#main").innerHTML='<div class="notice">التحميل طوّل شوي… تأكد من الاتصال.</div>'},10000):null;
  const {data,error}=await sb.from("posts").select("*");
  if(timer)clearTimeout(timer);
  if(error){$("#main").innerHTML='<div class="notice">صار خطأ في تحميل المحتوى. حدّث الصفحة.</div>';return}
  S.posts=data||[];
  await signPaths(S.posts.flatMap(p=>(p.media||[]).map(m=>m.path)));
  S.loaded=true;
  if(first&&S.posts.length){
    const months=new Set(S.posts.map(p=>p.date&&p.date.slice(0,7)));
    if(!months.has(S.ym)){const up=S.posts.map(p=>p.date).filter(Boolean).sort();S.ym=(up.find(d=>d>=todayISO)||up[up.length-1]).slice(0,7)}
  }
  if(first&&S.view==="list"&&S.ym===todayISO.slice(0,7))S.pendingScroll=todayISO;
  render();
}
async function movePost(id,newDate){
  const p=S.posts.find(x=>x.id===id);if(!p||p.date===newDate)return;
  try{const {error}=await sb.from("posts").update({date:newDate,updated_at:new Date().toISOString()}).eq("id",id);if(error)throw error;p.date=newDate;render();toast("انتقل البوست إلى "+dayName(newDate)+" "+shortDate(newDate))}
  catch(e){toast("ما انحفظ النقل، جرّب مرة ثانية")}
}
async function deletePost(id){
  try{const {error}=await sb.from("posts").delete().eq("id",id);if(error)throw error;S.posts=S.posts.filter(x=>x.id!==id);render();toast("انحذف البوست")}catch(e){toast("ما انحذف، جرّب مرة ثانية")}
}

/* ---------- render ---------- */
function monthPosts(){return S.posts.filter(p=>p.date&&p.date.startsWith(S.ym))}
function render(){
  const [y,m]=S.ym.split("-").map(Number);
  $("#monthLabel").textContent=MONTHS[m-1]+" "+y;
  $("#vList").setAttribute("aria-pressed",S.view==="list");
  $("#vMonth").setAttribute("aria-pressed",S.view==="month");
  const mp=monthPosts();
  $("#summary").innerHTML=
    '<div class="stat"><b>'+mp.length+'</b><span>بوست هالشهر</span></div>'+
    '';
  if(!S.loaded)return;
  if(S.view==="list")renderList(mp);else renderMonth(mp);
}

function daysInMonth(){const [y,m]=S.ym.split("-").map(Number);return new Date(Date.UTC(y,m,0)).getUTCDate()}

function renderList(mp){
  const main=$("#main");main.innerHTML="";
  const n=daysInMonth();let shown=0;
  const wrap=document.createElement("div");
  for(let d=1;d<=n;d++){
    const ds=S.ym+"-"+pad(d);
    let ps=mp.filter(p=>p.date===ds).sort(sortPosts);
    if(S.onlyMissing)ps=ps.filter(p=>missing(p).length);
    if(!ps.length&&!S.canEdit)continue;
    shown++;
    const sec=document.createElement("section");
    sec.className="day"+(ds===todayISO?" today":"")+(ps.length?"":" empty");
    sec.id="d-"+ds;
    sec.innerHTML='<div class="day-head"><div class="dn">'+dayName(ds)+'</div><div class="dd">'+d+'</div><div class="dm">'+MONTHS[parseISO(ds).getUTCMonth()]+'</div></div><div class="day-posts"></div>';
    const box=sec.querySelector(".day-posts");
    ps.forEach(p=>box.appendChild(card(p)));
    if(S.canEdit){
      const add=document.createElement("button");add.className="add-slot";add.textContent="+ أضف بوست";add.setAttribute("aria-label","أضف بوست ل"+dayName(ds)+" "+d);
      add.onclick=()=>openEditor(null,ds);box.appendChild(add);
      makeDrop(sec,ds);
    }
    wrap.appendChild(sec);
  }
  if(!shown){
    main.innerHTML='<div class="notice">'+(S.onlyMissing?'كل بوستات الشهر مكتملة.':'ما فيه بوستات في هالشهر.'+'')+'</div>';
    return;
  }
  main.appendChild(wrap);
  if(S.pendingScroll){const el=document.getElementById("d-"+S.pendingScroll);S.pendingScroll=null;if(el)el.scrollIntoView({block:"start"})}
}

function card(p){
  const el=document.createElement("article");el.dataset.id=p.id;
  const media=p.media||[];const ms=missing(p);
  el.className="card"+(ms.length?" notready":"");
  const first=media[0];
  let mHtml='<div class="media">';
  if(first){mHtml+=isVideo(first)?'<video src="'+mediaUrl(first)+'" muted playsinline preload="metadata"></video>':'<img loading="lazy" alt="تصميم البوست" src="'+mediaUrl(first)+'">';
    if(media.length>1)mHtml+='<span class="count">'+media.length+' صور</span>';}
  else mHtml+='<div class="ph">التصميم لسا ما نزل</div>';
  mHtml+='<span class="time">'+esc(fmtTime(p.time))+'</span></div>';
  const links=[];
  if(p.design)links.push('<a class="lk" href="'+esc(p.design)+'" target="_blank" rel="noopener">ملفات التصميم ↗</a>');
  if(p.landing)links.push('<a class="lk" href="'+esc(p.landing)+'" target="_blank" rel="noopener">الرابط الأصلي ↗</a>');
  if(p.animation)links.push('<a class="lk" href="'+esc(p.animation)+'" target="_blank" rel="noopener">الأنيميشن ↗</a>');
  const pl=PLATS.filter(([k])=>p.links&&p.links[k]);
  let body='<div class="body">';

      '<button data-a="edit" class="grow" title="تعديل" aria-label="تعديل"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>'+
      '<button data-a="dup" title="تكرار" aria-label="تكرار"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>'+
      '<button data-a="del" class="del" title="حذف" aria-label="حذف"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></button></div>';

  if(S.canEdit){
    el.querySelector('[data-a="up"]').onclick=()=>movePost(p.id,addDays(p.date,-1));
    el.querySelector('[data-a="down"]').onclick=()=>movePost(p.id,addDays(p.date,1));
    el.querySelector('[data-a="edit"]').onclick=()=>openEditor(p);
    el.querySelector('[data-a="dup"]').onclick=()=>openEditor(Object.assign({},p,{id:null}),null,true);

    el.draggable=true;
    el.addEventListener("dragstart",e=>{S.dragId=p.id;el.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",p.id)}catch(_){}} );
    el.addEventListener("dragend",()=>{S.dragId=null;el.classList.remove("dragging")});
  }
  return el;
}

function makeDrop(el,ds){
  el.addEventListener("dragover",e=>{if(!S.dragId)return;e.preventDefault();el.classList.add("drop")});
  el.addEventListener("dragleave",e=>{if(!el.contains(e.relatedTarget))el.classList.remove("drop")});
  el.addEventListener("drop",e=>{e.preventDefault();el.classList.remove("drop");const id=S.dragId;S.dragId=null;if(id)movePost(id,ds)});
}

function renderMonth(mp){
  const main=$("#main");main.innerHTML="";
  const g=document.createElement("div");g.className="grid";
  DAYS.forEach(d=>{const w=document.createElement("div");w.className="wd";w.textContent=d;g.appendChild(w)});
  const first=parseISO(S.ym+"-01");const lead=first.getUTCDay();const n=daysInMonth();
  for(let i=0;i<lead;i++){const c=document.createElement("div");c.className="cell out";g.appendChild(c)}
  for(let d=1;d<=n;d++){
    const ds=S.ym+"-"+pad(d);
    let ps=mp.filter(p=>p.date===ds).sort(sortPosts);
    if(S.onlyMissing)ps=ps.filter(p=>missing(p).length);
    const c=document.createElement("div");c.className="cell"+(ds===todayISO?" today":"");c.tabIndex=0;
    c.setAttribute("role","button");c.setAttribute("aria-label",dayName(ds)+" "+d);
    c.innerHTML='<div class="n"><span>'+d+'</span>'+'</div><div class="thumbs"></div>';
    const th=c.querySelector(".thumbs");
    ps.slice(0,4).forEach(p=>{
      const t=document.createElement("div");t.className="t"+(missing(p).length?" miss":"");t.title=fmtTime(p.time);
      const m=(p.media||[])[0];
      t.innerHTML=(m?(isVideo(m)?'<video src="'+mediaUrl(m)+'" muted preload="metadata"></video>':'<img loading="lazy" alt="" src="'+mediaUrl(m)+'">'):'')+'<i>'+esc(p.time||"؟")+'</i>';
      if(S.canEdit){t.draggable=true;
        t.addEventListener("dragstart",e=>{e.stopPropagation();S.dragId=p.id;try{e.dataTransfer.setData("text/plain",p.id)}catch(_){}});
        t.addEventListener("dragend",()=>{S.dragId=null});}
      th.appendChild(t);
    });
    if(ps.length>4){const more=document.createElement("div");more.className="t";more.innerHTML='<i style="position:static;display:grid;place-items:center;height:100%;color:var(--muted);text-shadow:none">+'+(ps.length-4)+'</i>';th.appendChild(more)}
    const go=()=>{S.view="list";S.pendingScroll=ds;if(!ps.length&&S.canEdit)S.showEmpty=true;render()};
    c.onclick=go;c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
    if(S.canEdit)makeDrop(c,ds);
    g.appendChild(c);
  }
  main.appendChild(g);
}

/* ---------- lightbox ---------- */
function openLightbox(p,i){
  const media=p.media||[];if(!media.length)return;
  const root=$("#lbRoot");
  const draw=()=>{
    const m=media[i];
    root.innerHTML='<div class="lb" role="dialog" aria-modal="true" aria-label="معاينة البوست"><div class="stage">'+
      '<button class="x" aria-label="إغلاق">✕</button>'+
      (isVideo(m)?'<video src="'+mediaUrl(m)+'" controls autoplay playsinline></video>':'<img alt="تصميم البوست" src="'+mediaUrl(m)+'">')+
      (media.length>1?'<button class="nav prev" aria-label="السابق">›</button><button class="nav next" aria-label="التالي">‹</button><span class="pos">'+(i+1)+' / '+media.length+'</span>':'')+
      '</div><aside><h3>'+dayName(p.date)+' '+shortDate(p.date)+' · '+esc(fmtTime(p.time))+'</h3><p>'+esc(p.caption||"الكابشن لسا ما نزل")+'</p></aside></div>';
    root.querySelector(".x").onclick=close;
    root.querySelector(".lb").onclick=e=>{if(e.target.classList.contains("stage"))close()};
    const pv=root.querySelector(".prev"),nx=root.querySelector(".next");
    if(pv)pv.onclick=()=>{i=(i-1+media.length)%media.length;draw()};
    if(nx)nx.onclick=()=>{i=(i+1)%media.length;draw()};
    root.querySelector(".x").focus();
  };
  const key=e=>{if(e.key==="Escape")close();if(media.length>1&&e.key==="ArrowLeft"){i=(i+1)%media.length;draw()}if(media.length>1&&e.key==="ArrowRight"){i=(i-1+media.length)%media.length;draw()}};
  function close(){root.innerHTML="";document.removeEventListener("keydown",key)}
  document.addEventListener("keydown",key);draw();
}

/* ---------- delete confirm ---------- */
function confirmDelete(p){
  const root=$("#modalRoot");
  root.innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" style="width:min(420px,100%)"><header><h2>تحذف البوست؟</h2></header><div class="content"><p style="margin:0">بوست '+dayName(p.date)+' '+shortDate(p.date)+' الساعة '+esc(fmtTime(p.time))+' بينحذف من التقويم نهائيًا.</p></div><footer><button class="btn danger solid" id="cDel">احذف</button><button class="btn" id="cNo">إلغاء</button></footer></div></div>';
  const close=()=>root.innerHTML="";
  $("#cNo").onclick=close;$("#cNo").focus();
  $("#cDel").onclick=async()=>{close();await deletePost(p.id)};
  root.querySelector(".overlay").onclick=e=>{if(e.target.classList.contains("overlay"))close()};
}

      '</div>'+
    '</div></div>'+
    '<div class="field"><label>التصميم</label><div class="drop-zone" id="dz"><div class="mlist" id="mlist"></div>'+

    '<div class="field"><label for="fCap">الكابشن</label><textarea id="fCap" placeholder="الصق الكابشن هنا">'+esc(v.caption||"")+'</textarea>'+
      '<div class="sp-bar"><button type="button" class="btn sp-btn" id="spBtn"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16l4-10 4 10"/><path d="M5.5 12.5h5"/><path d="M14 17l2.5 2.5L21 14"/></svg> مراجعة إملائية</button><span class="hint" id="spMsg"></span></div><div class="sp-list" id="spList"></div></div>'+
    '<div class="row2"><div class="field"><label for="fDesign">رابط ملفات التصميم</label><input type="url" id="fDesign" placeholder="https://drive.google.com/…" value="'+esc(v.design||"")+'"></div>'+
    '<div class="field"><label for="fAnim">رابط الأنيميشن</label><input type="url" id="fAnim" placeholder="https://…" value="'+esc(v.animation||"")+'"></div></div>'+
    '<div class="field"><label for="fLanding">ضع الرابط الأصلي في حال لا يوجد اختصار</label><input type="url" id="fLanding" placeholder="https://www.mobily.com.sa/…" value="'+esc(v.landing||"")+'"><span class="hint" id="landHint">يصير البوست «بانتظار الاختصار» لين تنضاف الروابط المختصرة. هذا الرابط ما يطلع في ملف الإكسل.</span></div>'+
    '<details class="field pl"><summary>روابط المنصات المختصرة</summary><div class="grid5">'+

    '</div></details>'+
    '<div class="field"><label for="fNote">ملاحظة (تطلع للكل)</label><input type="text" id="fNote" value="'+esc(v.note||"")+'" placeholder="مثلًا: بانتظار موافقة العميل على السعر"></div>'+
   '</div>'+
   '<footer><button type="submit" class="btn primary" id="edSave">'+(isNew?'أضف للتقويم':'احفظ التعديل')+'</button><button type="button" class="btn" id="edCancel">إلغاء</button><span class="msg" id="edMsg"></span></footer>'+
  '</form></div>';
  const close=()=>{document.removeEventListener("paste",onPaste);document.removeEventListener("keydown",onKey);root.innerHTML=""};

    const sel=$("#fDate").value;if(!dpS.start)dpS.start=weekStart(sel);

  const isPreset=t=>PRESETS.some(x=>x[0]===t);
  const takenOn=d=>S.posts.filter(x=>x.date===d&&(!p||x.id!==p.id||isDup)).map(x=>x.time).filter(Boolean);
  function setCustomFrom(t){const [hh,mm]=t.split(":").map(Number);ts.a=hh<12?"am":"pm";ts.h=((hh+11)%12)+1;ts.m=pad((Math.round(mm/15)*15)%60)}

  else if(isNew&&!isDup)autoPick();
  function tVal(){if(ts.mode==="preset")return ts.preset;if(ts.mode==="custom"){let h=ts.h%12;if(ts.a==="pm")h+=12;return pad(h)+":"+ts.m}return ""}

    const t=tVal();$("#tLabel").textContent=t?"· "+fmtTime(t)+(taken.includes(t)?" (فيه بوست ثاني بنفس الوقت)":""):"· لم يحدد";

  document.querySelectorAll("#tp [data-mode]").forEach(b=>b.onclick=()=>{ts.mode=b.dataset.mode;ts.touched=true;drawTime()});
  const toCustom=()=>{ts.mode="custom";ts.touched=true;drawTime()};
  $("#tpH").onchange=e=>{ts.h=Number(e.target.value);toCustom()};
  $("#tpc").addEventListener("focusin",()=>{if(ts.mode!=="custom")toCustom()});
  document.querySelectorAll("#tpM [data-m]").forEach(b=>b.onclick=()=>{ts.m=b.dataset.m;toCustom()});
  document.querySelectorAll("#tpA [data-a]").forEach(b=>b.onclick=()=>{ts.a=b.dataset.a;toCustom()});
  $("#fDate").addEventListener("change",()=>{if(isNew&&!isDup&&!ts.touched)autoPick();drawTime()});

    const ml=$("#mlist");ml.innerHTML="";
    st.media.forEach((m,i)=>{

      it.innerHTML=(isVideo(m)?'<video src="'+mediaUrl(m)+'" muted></video>':'<img alt="" src="'+mediaUrl(m)+'">')+'<button type="button" aria-label="شيل">✕</button>'+
        (st.media.length>1?'<div class="mv"><button type="button" data-d="1" aria-label="قدّم">›</button><button type="button" data-d="-1" aria-label="أخّر">‹</button></div>':'');
      it.querySelector("button").onclick=()=>{st.media.splice(i,1);drawMedia()};
      it.querySelectorAll(".mv button").forEach(b=>b.onclick=()=>{const k=b.dataset.d==="1"?i-1:i+1;if(k<0||k>=st.media.length)return;[st.media[i],st.media[k]]=[st.media[k],st.media[i]];drawMedia()});
      ml.appendChild(it);
    });
    $("#upMsg").textContent=st.uploading?"جاري رفع "+st.uploading+"…":"";
  };
  drawMedia();

  async function upload(files){
    files=[...files].filter(f=>/^(image|video)\//.test(f.type));
    if(!files.length)return;
    for(const f of files){
      st.uploading++;drawMedia();
      try{
        if(f.size>50*1024*1024){const er=new Error("big");er.code="too_large";throw er}
        const ext=((f.name||"").split(".").pop()||f.type.split("/")[1]||"bin").toLowerCase().replace(/[^a-z0-9]/g,"");
        const path=new Date().toISOString().slice(0,7)+"/"+crypto.randomUUID()+"."+ext;
        const {error}=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type});
        if(error)throw error;
        await signPaths([path]);
        st.media.push({path,type:f.type.startsWith("video")?"video":"image"});
      }catch(e){
        const c=e&&e.code;
        toast(c==="too_large"?"الملف أكبر من 50 ميجا":c==="unsupported_type"?"نوع الملف غير مدعوم":"ما انرفع "+(f.name||"الملف")+"، جرّب مرة ثانية");
      }
      st.uploading--;drawMedia();
    }
  }
  $("#fFile").onchange=e=>{upload(e.target.files);e.target.value=""};
  const dz=$("#dz");
  dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over")});
  dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
  dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");upload(e.dataTransfer.files)});
  function onPaste(e){const fs=[...(e.clipboardData&&e.clipboardData.files||[])];if(fs.length){e.preventDefault();upload(fs)}}
  document.addEventListener("paste",onPaste);

  $("#ed").onsubmit=async e=>{
    e.preventDefault();
    if(st.uploading){$("#edMsg").textContent="استنى يخلص الرفع";return}
    const links={};PLATS.forEach(([k])=>{const val=$("#fL_"+k).value.trim();if(val)links[k]=val});
    const data={
      date:$("#fDate").value,time:tVal(),caption:$("#fCap").value,
      media:st.media,design:$("#fDesign").value.trim(),animation:$("#fAnim").value.trim(),
      links,landing:$("#fLanding").value.trim(),note:$("#fNote").value.trim(),updated_at:new Date().toISOString()
    };
    if(!data.date){$("#edMsg").textContent="حدد التاريخ";return}
    $("#edSave").disabled=true;$("#edMsg").textContent="جاري الحفظ…";
    try{
      const res=isNew?await sb.from("posts").insert(data):await sb.from("posts").update(data).eq("id",p.id);
      if(res.error)throw res.error;
      await loadPosts(false);
      close();toast(isNew?"انضاف البوست":"انحفظ التعديل");
      if(!data.date.startsWith(S.ym)){S.ym=data.date.slice(0,7);render()}
    }catch(err){
      $("#edSave").disabled=false;
      $("#edMsg").textContent="ما انحفظ، جرّب مرة ثانية"+(err&&err.message?" ("+err.message+")":"");
    }
  };
  setTimeout(()=>$("#fCap").focus(),30);
}

const EN_DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function loadExcelJS(){

  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});

async function imageJpeg(id){
  const url=S.urls[id]||(await signPaths([id]),S.urls[id]);const r=await fetch(url);if(!r.ok)throw new Error("img");
  const bmp=await createImageBitmap(await r.blob());
  const k=Math.min(1,600/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const b64=c.toDataURL("image/jpeg",0.88).split(",")[1];
  return {b64,w:c.width,h:c.height};
}

/* Excel export always uses Mobily's brand fonts (Ali, 19 Nov 2026) */
const XF_HEAD="Mobily_Headline_v7",XF_TEXT="Mobily_Text_v7";
async function buildXlsx(posts,snapOnly,full){
  await loadExcelJS();
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("Calendar",{views:[{state:"frozen",ySplit:3,showGridLines:false}]});
  ws.columns=[{width:15},{width:11},{width:22},{width:50},{width:12},{width:12},{width:13},{width:40}];
  const LINE={style:"thin",color:{argb:"FFD5DEF0"}};
  const fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});
  const ps=posts.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:sortPosts(a,b));
  const d0=full?parseISO(S.ym+"-01"):parseISO(ps[0].date),d1=full?parseISO(S.ym+"-"+pad(daysInMonth())):parseISO(ps[ps.length-1].date);
  const range=full?EN_MON[d0.getUTCMonth()]+" 1 – "+d1.getUTCDate()+", "+d1.getUTCFullYear():EN_MON[d0.getUTCMonth()]+" "+d0.getUTCDate()+(ps[0].date===ps[ps.length-1].date?"":" – "+(d0.getUTCMonth()===d1.getUTCMonth()?"":EN_MON[d1.getUTCMonth()]+" ")+d1.getUTCDate())+", "+d1.getUTCFullYear();
  ws.mergeCells("A1:H1");
  const t=ws.getCell("A1");t.value="Mobily Consumer Calendar  ·  "+range;
  t.font={name:XF_HEAD,size:18,bold:true,color:{argb:"FFFFFFFF"}};t.fill=fill("FF0E61FE");t.alignment={vertical:"middle",indent:1};
  ws.getRow(1).height=36;ws.getRow(2).height=6;
  ["Date","Time","Visual","Caption","Design","Animation","Platform","Landing Page"].forEach((h,i)=>{
    const c=ws.getRow(3).getCell(i+1);c.value=h;c.font={name:XF_HEAD,size:11,bold:true,color:{argb:"FFFFFFFF"}};
    c.fill=fill("FF0A1A4A");c.alignment={horizontal:"center",vertical:"middle"};
  });
  ws.getRow(3).height=26;
  const plats=snapOnly?[["Snapchat","Snapchat"]]:PLATS;
  const per=plats.length;
  const rowH=snapOnly?120:32;
  let r=4;let dayIdx=-1;let lastDate=null;
  const byDay={};ps.forEach(p=>{(byDay[p.date]=byDay[p.date]||[]).push(p)});
  if(full)for(let d=1;d<=daysInMonth();d++){const k=S.ym+"-"+pad(d);if(!byDay[k])byDay[k]=[null]}
  const imgCache={};
  for(const ds of Object.keys(byDay).sort()){
    dayIdx++;const dayPosts=byDay[ds];const dayStart=r;
    const base=dayIdx%2?"FFFFFFFF":"FFF6F9FF";
    for(const p of dayPosts){
      if(!p){
        for(let i=0;i<per;i++){
          const row=ws.getRow(r+i);row.height=rowH;
          for(let c=2;c<=8;c++){const cell=row.getCell(c);cell.fill=fill(base);cell.border={top:LINE,bottom:LINE,left:LINE,right:LINE};cell.alignment={horizontal:"center",vertical:"middle",wrapText:true};}
          const g=row.getCell(7);g.value=plats[i][1];g.font={name:XF_HEAD,size:10,bold:true,color:{argb:PLAT_COLOR[plats[i][0]]}};
        }
        if(per>1)["B","C","D","E","F"].forEach(col=>ws.mergeCells(col+r+":"+col+(r+per-1)));
        r+=per;continue;
      }
      const rowFill=missing(p).length?"FFFFF4D6":base;
      for(let i=0;i<per;i++){
        const row=ws.getRow(r+i);row.height=rowH;
        for(let c=2;c<=8;c++){const cell=row.getCell(c);cell.fill=fill(rowFill);cell.border={top:LINE,bottom:LINE,left:LINE,right:LINE};cell.alignment={horizontal:"center",vertical:"middle",wrapText:true};}
      }
      const row=ws.getRow(r);
      // time
      const tc=row.getCell(2);
      if(p.time){const [hh,mm]=p.time.split(":").map(Number);tc.value=(hh*60+mm)/1440;tc.numFmt="h:mm AM/PM"}else tc.value="TBD";
      tc.font={name:XF_HEAD,size:11,bold:true,color:{argb:"FF0A1A4A"}};
      // caption
      const cc=row.getCell(4);cc.value=(p.caption&&p.caption.trim())||"TBD";
      cc.font={name:XF_TEXT,size:10,color:{argb:"FF1F2A44"}};cc.alignment={horizontal:"right",vertical:"middle",wrapText:true,readingOrder:"rtl"};
      // design + animation
      [[5,p.design],[6,p.animation]].forEach(([c,u])=>{
        const cell=row.getCell(c);
        if(u){cell.value={text:"Open ↗",hyperlink:u};cell.font={name:XF_HEAD,size:10,bold:true,color:{argb:"FF0E61FE"}}}
        else{cell.value="—";cell.font={name:XF_TEXT,size:10,color:{argb:"FFB0B7C6"}}}
      });
      // platforms
      plats.forEach(([k,l],i)=>{
        const pr=ws.getRow(r+i);
        const g=pr.getCell(7);g.value=l;g.font={name:XF_HEAD,size:10,bold:true,color:{argb:PLAT_COLOR[k]}};
        const urls=String((p.links&&p.links[k])||"").split(/\s+/).filter(Boolean);
        const h=pr.getCell(8);
        if(urls.length){h.value={text:urls.join("\n"),hyperlink:urls[0]};h.font={name:XF_TEXT,size:10,color:{argb:"FF0E61FE"}}}
        else{h.value="TBD";h.font={name:XF_TEXT,size:10,color:{argb:"FFB0B7C6"}}}
        h.alignment={horizontal:"left",vertical:"middle",wrapText:true};
      });
      if(per>1)["B","C","D","E","F"].forEach(col=>ws.mergeCells(col+r+":"+col+(r+per-1)));
      // visual
      const m=(p.media||[]).find(x=>!isVideo(x));if(m)m.id=m.path;
      if(m){
        try{
          const im=imgCache[m.id]||(imgCache[m.id]=await imageJpeg(m.id));
          const id=wb.addImage({base64:im.b64,extension:"jpeg"});
          const size=150,blockPx=rowH*per*4/3;
          const w=im.w>=im.h?size:Math.round(size*im.w/im.h),h=im.h>=im.w?size:Math.round(size*im.h/im.w);
          const offY=Math.max(0,(blockPx-h)/2)/(rowH*4/3),offX=Math.max(0,(159-w)/2)/159;
          ws.addImage(id,{tl:{col:2+offX,row:(r-1)+offY},ext:{width:w,height:h},editAs:"oneCell"});
        }catch(e){row.getCell(3).value="—"}
      }else if((p.media||[]).length){row.getCell(3).value="فيديو"}
      r+=per;
    }
    // day cell
    const dd=parseISO(ds);
    if(r-1>dayStart)ws.mergeCells("A"+dayStart+":A"+(r-1));
    const a=ws.getCell("A"+dayStart);
    a.value=EN_DAYS[dd.getUTCDay()]+"\n"+dd.getUTCDate()+" "+EN_MON[dd.getUTCMonth()];
    a.font={name:XF_HEAD,size:12,bold:true,color:{argb:"FF0E61FE"}};a.fill=fill("FFEAF1FF");
    a.alignment={horizontal:"center",vertical:"middle",wrapText:true};
    a.border={top:{style:"medium",color:{argb:"FF0A1A4A"}},bottom:LINE,left:LINE,right:LINE};
    for(let c=2;c<=8;c++){const cell=ws.getRow(dayStart).getCell(c);cell.border=Object.assign({},cell.border,{top:{style:"medium",color:{argb:"FF0A1A4A"}}})}
  }
    // Mobily brand fonts on every cell, including ones without their own font
  ws.eachRow({includeEmpty:true},row=>row.eachCell({includeEmpty:true},cell=>{
    const f=cell.font||{};if(!f.name||f.name==="Calibri")cell.font=Object.assign({},f,{name:XF_TEXT});
  }));
  const buf=await wb.xlsx.writeBuffer();
  const name=full?"Mobily Calendar "+MONTHS_EN_FULL[d0.getUTCMonth()]+" "+d0.getUTCFullYear()+(snapOnly?" Snapchat":"")+".xlsx":"Mobily_Calendar_"+EN_MON[d0.getUTCMonth()]+d0.getUTCDate()+"-"+(d0.getUTCMonth()===d1.getUTCMonth()?"":EN_MON[d1.getUTCMonth()])+d1.getUTCDate()+(snapOnly?"_Snapchat":"")+".xlsx";
  return {buf,name};
}

async function loadCommits(){
  try{const r=await fetch("https://api.github.com/repos/"+GH_REPO+"/commits?per_page=40",{cache:"no-store"});if(!r.ok)return;
    const j=await r.json();FEED.commits=j.map(c=>({at:c.commit.author.date,login:(c.author&&c.author.login)||(c.commit.author&&c.commit.author.name)||"",msg:String(c.commit.message||"").split("\n")[0],url:c.html_url}));renderFeed()}catch(e){}
}
function feedItems(){
  const items=[];
  // collapse bursts (e.g. an Excel import): same person, same action, within 3 minutes
  let i=0;const A=FEED.acts;
  while(i<A.length){const a=A[i];let j=i+1;while(j<A.length&&A[j].actor===a.actor&&A[j].action===a.action&&a.action!=="update"&&Math.abs(new Date(A[j-1].at)-new Date(A[j].at))<180000)j++;
    items.push({kind:"content",at:a.at,a,count:j-i});i=j}
  FEED.commits.forEach(c=>items.push({kind:"dev",at:c.at,c}));
  items.sort((x,y)=>new Date(y.at)-new Date(x.at));
  const f=FEED.filter;
  return items.filter(it=>f==="all"||(f==="content"&&it.kind==="content")||(f==="dev"&&it.kind==="dev")||(it.kind==="content"?personOf(it.a.actor).key===f:personOfGh(it.c.login).key===f));
}
function contentText(a,count){
  const per=personOf(a.actor),d=a.details||{},lbl='<em>«'+esc(a.label)+'»</em>';
  if(count>1){const w=whoVerb(per,a.action);return {per,icon:FICON[a.action]||FICON.update,html:w.who+" "+w.v+" "+count+" بوست"}}
  if(a.action==="create"){const w=whoVerb(per,"create");return {per,icon:FICON.create,html:w.who+" "+w.v+" "+lbl+(d.date?" ليوم "+shortDate(d.date):"")}}
  if(a.action==="delete"){const w=whoVerb(per,"delete");return {per,icon:FICON.delete,html:w.who+" "+w.v+" "+lbl}}
  if(a.action==="move"){const w=whoVerb(per,"move");return {per,icon:FICON.move,html:w.who+" "+w.v+" "+lbl+" من "+parseISO(d.from).getUTCDate()+" إلى "+shortDate(d.to)}}
  const f=d.fields||[];
  if(f.length===1&&f[0]==="media"&&d.media_delta>0){const w=whoVerb(per,"media");return {per,icon:FICON.media,html:w.who+" "+w.v+" "+lbl}}
  if(f.length===1&&f[0]==="links"){const w=whoVerb(per,"links");return {per,icon:FICON.links,html:w.who+" "+w.v+" "+lbl+(d.links?" ("+d.links+")":"")}}
  if(f.length===1&&f[0]==="time"){const w=whoVerb(per,"time");return {per,icon:FICON.time,html:w.who+" "+w.v+" "+lbl+" إلى "+esc(fmtTime(d.new_time))}}
  const w=whoVerb(per,"update");return {per,icon:FICON.update,html:w.who+" "+w.v+" "+lbl+(f.length?": "+f.map(x=>FIELD_AR[x]||x).join("، "):"")}
}
function renderFeed(){
  const box=$("#feedList");if(!box)return;
  const people=[{k:"all",t:"الكل"},{k:"content",t:"المحتوى"},{k:"dev",t:"تطوير الموقع"},{k:S.me,t:"أنا"}].concat(Object.keys(PEOPLE).filter(e=>e!==S.me).map(e=>({k:e,t:PEOPLE[e].name})));
  $("#feedF").innerHTML=people.map(p=>'<button type="button" data-f="'+esc(p.k)+'" aria-pressed="'+(FEED.filter===p.k)+'">'+esc(p.t)+'</button>').join("");
  $("#feedF").querySelectorAll("button").forEach(b=>b.onclick=()=>{FEED.filter=b.dataset.f;renderFeed()});
  const items=feedItems();
  if(!items.length){box.innerHTML='<div class="hint" style="padding:12px 6px">ما فيه تحديثات لين الحين. أي تعديل يصير يطلع هنا على طول.</div>';return}
  let h="",lastDay="";
  items.slice(0,120).forEach((it,idx)=>{
    const k=dayKey(it.at);if(k!==lastDay){h+='<div class="feed-g">'+dayTitle(k)+'</div>';lastDay=k}
    if(it.kind==="dev"){const per=personOfGh(it.c.login),w=whoVerb(per,"dev");
      h+='<button type="button" class="fe dev" data-url="'+esc(it.c.url)+'"><span class="av '+per.cls+'">'+esc(per.name.slice(0,1))+'</span><span><span class="fe-t">'+FICON.dev+w.who+" "+w.v+": "+esc(it.c.msg)+'<span class="dev-b">تطوير</span></span><span class="fe-w">'+relTime(it.at)+' · على الموقع</span></span></button>';}
    else{const c=contentText(it.a,it.count);
      h+='<button type="button" class="fe" data-post="'+esc(it.count>1?"":it.a.post_id||"")+'"><span class="av '+c.per.cls+'">'+esc(c.per.name.slice(0,1))+'</span><span><span class="fe-t">'+c.icon+c.html+'</span><span class="fe-w">'+relTime(it.at)+'</span></span></button>';}
  });
  box.innerHTML=h;
  box.querySelectorAll("[data-url]").forEach(b=>b.onclick=()=>window.open(b.dataset.url,"_blank","noopener"));
  box.querySelectorAll("[data-post]").forEach(b=>b.onclick=()=>{const id=b.dataset.post;if(id)goToPost(id)});
}
function goToPost(id){
  const p=S.posts.find(x=>x.id===id);if(!p){toast("هذا البوست انحذف");return}
  S.view="list";S.ym=p.date.slice(0,7);render();
  $("#feed").classList.remove("open");
  requestAnimationFrame(()=>{const el=document.querySelector('.card[data-id="'+CSS.escape(id)+'"]');if(!el)return;el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash")});
}
function startFeed(){
  $("#feed").classList.remove("hidden");$("#feedBtn").classList.remove("hidden");
  const narrow=()=>matchMedia("(max-width:1100px)").matches;
  const setOff=off=>{document.body.classList.toggle("feed-off",off);try{localStorage.setItem("mc-feed-off",off?"1":"0")}catch(e){}};
  try{if(localStorage.getItem("mc-feed-off")==="1")document.body.classList.add("feed-off")}catch(e){}
  $("#feedBtn").onclick=()=>{if(narrow())$("#feed").classList.toggle("open");else setOff(false)};
  $("#feedHide").onclick=()=>setOff(true);$("#feedX").onclick=()=>$("#feed").classList.remove("open");
  loadActivity();loadCommits();
  let t=null;sb.channel("activity-live").on("postgres_changes",{event:"INSERT",schema:"public",table:"activity"},()=>{clearTimeout(t);t=setTimeout(loadActivity,300)}).subscribe();
  setInterval(()=>{if(!document.hidden)loadCommits()},120000);
  setInterval(()=>{if(!document.hidden)renderFeed()},60000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden){loadActivity();loadCommits()}});
}

/* ---------- spelling review (flags only, never changes the text) ---------- */
let DICT=null;
async function loadDict(){if(DICT)return DICT;const {data}=await sb.from("dictionary").select("word");DICT=new Set((data||[]).map(r=>normWord(r.word)));return DICT}
function normWord(w){return String(w||"").trim().replace(/[ً-ْـ]/g,"")}
async function checkSpelling(text){
  const body=new URLSearchParams({text,language:"ar",enabledOnly:"false"});
  const r=await fetch("https://api.languagetool.org/v2/check",{method:"POST",body});
  if(!r.ok)throw new Error(r.status===429?"كثرت المراجعات، انتظر دقيقة":"خدمة المراجعة ما ردّت");
  const j=await r.json();const dict=await loadDict();
  return (j.matches||[]).map(m=>({word:text.substr(m.offset,m.length),offset:m.offset,length:m.length,msg:m.message,reps:(m.replacements||[]).slice(0,3).map(x=>x.value),typo:m.rule&&m.rule.category&&m.rule.category.id==="TYPOS"}))
    .filter(x=>x.word.trim()&&!/^[\sA-Za-z0-9.,:;!?%+\-\/@#_&()'"|]+$/.test(x.word)&&!x.word.split(/\s+/).every(w=>dict.has(normWord(w))));
}
function wireSpelling(){
  const ta=$("#fCap"),list=$("#spList"),msg=$("#spMsg"),btn=$("#spBtn");let checked="";
  ta.addEventListener("input",()=>{if(checked&&ta.value!==checked){msg.textContent="تغيّر الكابشن، راجع مرة ثانية";list.classList.add("stale")}});
  btn.onclick=async()=>{
    const text=ta.value;if(!text.trim()){msg.textContent="الكابشن فاضي";return}
    btn.disabled=true;msg.textContent="جاري المراجعة…";list.innerHTML="";list.classList.remove("stale");
    try{
      const issues=await checkSpelling(text);checked=text;
      msg.textContent=issues.length?("لقيت "+issues.length+" ملاحظة. ما غيّرت شي في النص"):"ما لقيت أخطاء إملائية";
      list.innerHTML=issues.map((x,i)=>{
        const before=text.slice(Math.max(0,x.offset-18),x.offset),after=text.slice(x.offset+x.length,x.offset+x.length+18);
        return '<div class="sp-item" data-i="'+i+'"><div class="sp-ctx">…'+esc(before)+'<mark>'+esc(x.word)+'</mark>'+esc(after)+'…</div>'+
          '<div class="sp-row"><span class="sp-sug">'+(x.reps.length?'يمكن تقصد: '+x.reps.map(r=>'<b>'+esc(r)+'</b>').join("، "):esc(x.msg))+'</span>'+
          '<button type="button" class="sp-ok" data-w="'+esc(x.word)+'">مو غلط</button></div></div>';
      }).join("");
      list.querySelectorAll(".sp-ok").forEach(b=>b.onclick=async()=>{
        const words=b.dataset.w.split(/\s+/).map(normWord).filter(Boolean);
        b.disabled=true;
        const {error}=await sb.from("dictionary").upsert(words.map(word=>({word})));
        if(error){b.disabled=false;toast("ما انحفظت الكلمة");return}
        words.forEach(w=>DICT&&DICT.add(w));
        const it=b.closest(".sp-item");it.remove();
        const left=list.querySelectorAll(".sp-item").length;
        msg.textContent=left?("باقي "+left+" ملاحظة"):"تمام، ما باقي ملاحظات";
        toast("انضافت للقاموس، ما راح تنبّه عليها مرة ثانية");
      });
    }catch(e){msg.textContent=e.message||"ما قدرت أراجع الحين"}
    btn.disabled=false;
  };
}

/* ---------- import a calendar Excel (same layout as the team's sheet) ---------- */
const MON_IDX={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function cellText(v){
  if(v==null)return "";
  if(typeof v==="object"){
    if(v.richText)return v.richText.map(r=>r.text).join("");
    if(v.text!=null)return typeof v.text==="object"?cellText(v.text):String(v.text);
    if(v.result!=null)return String(v.result);
    if(v instanceof Date)return v.toISOString();
  }
  return String(v);
}
function cellLink(v){if(v&&typeof v==="object"&&v.hyperlink)return v.hyperlink;const t=cellText(v).trim();return /^https?:\/\//.test(t)?t:""}
function cellTime(v){
  if(v instanceof Date)return pad(v.getUTCHours())+":"+pad(v.getUTCMinutes());
  if(typeof v==="number"){const m=Math.round((v%1)*1440);return pad(Math.floor(m/60))+":"+pad(m%60)}
  const t=cellText(v).trim();const m=t.match(/^(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
  if(m){let h=+m[1];if(m[3]){h=h%12+(m[3].toUpperCase()==="PM"?12:0)}return pad(h)+":"+m[2]}
  return "";
}
function clean(t){t=(t||"").trim();return /^(TBD|TBC|—|-)$/i.test(t)?"":t}
async function parseCalendarXlsx(file){
  await loadExcelJS();await loadJSZip();
  const zip=await JSZip.loadAsync(await file.arrayBuffer());
  const {imgs,sheetPath}=await extractImages(zip);
  // ExcelJS can't read some drawing layouts, so load the cells without the drawing
  if(sheetPath&&zip.file(sheetPath)){
    const x=await zip.file(sheetPath).async("string");zip.file(sheetPath,x.replace(/<drawing\b[^>]*\/>/g,""));
    const parts=sheetPath.split("/");const nm=parts.pop();const rp=parts.join("/")+"/_rels/"+nm+".rels";
    if(zip.file(rp)){const r=await zip.file(rp).async("string");zip.file(rp,r.replace(/<Relationship\b[^>]*\/drawing"[^>]*\/>/g,""))}
    Object.keys(zip.files).filter(f=>/^xl\/drawings\//.test(f)).forEach(f=>zip.remove(f));
  }
  const wb=new ExcelJS.Workbook();await wb.xlsx.load(await zip.generateAsync({type:"arraybuffer"}));
  const ws=wb.worksheets[0];
  let header=0,year=new Date().getFullYear();
  ws.eachRow((row,r)=>{const a=cellText(row.getCell(1).value);const y=a.match(/(20\d\d)/);if(y&&r<4)year=+y[1];if(!header&&/^date$/i.test(a.trim())&&/time/i.test(cellText(row.getCell(2).value)))header=r});
  if(!header)throw new Error("ما لقيت صف العناوين (Date / Time)");
  const posts=[];let date=null,cur=null;
  for(let r=header+1;r<=ws.rowCount;r++){
    const row=ws.getRow(r);
    const A=row.getCell(1),B=row.getCell(2);
    if(!(A.isMerged&&A.master.address!==A.address)){
      const t=cellText(A.value);const m=t.match(/(\d{1,2})\s*([A-Za-z]{3})/);
      if(m&&MON_IDX[m[2].toLowerCase()]!=null)date=year+"-"+pad(MON_IDX[m[2].toLowerCase()]+1)+"-"+pad(+m[1]);
    }
    const bSlave=B.isMerged&&B.master.address!==B.address;
    if(!bSlave&&B.value!=null&&cellText(B.value).trim()!==""&&date){
      cur={date,time:cellTime(B.value),caption:clean(cellText(row.getCell(4).value)),design:cellLink(row.getCell(5).value),animation:cellLink(row.getCell(6).value),links:{},img:imgs[r]||null};
      posts.push(cur);
    }
    if(cur){
      const plat=cellText(row.getCell(7).value).trim();
      const key=PLATS.map(x=>x[0]).find(k=>k.toLowerCase()===plat.toLowerCase());
      if(key){const h=row.getCell(8).value;const urls=(cellLink(h)?[cellLink(h)]:[]).concat(cellText(h).split(/\s+/).filter(u=>/^https?:\/\//.test(u)));const u=[...new Set(urls)].join("\n");if(u)cur.links[key]=u}
    }
  }
  return posts;
}
function loadJSZip(){
  if(window.JSZip)return Promise.resolve();
  return new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=res;s.onerror=rej;document.head.appendChild(s)});
}
function resolvePath(base,target){if(target.startsWith("/"))return target.slice(1);const parts=base.split("/");parts.pop();for(const seg of target.split("/")){if(seg==="..")parts.pop();else if(seg!==".")parts.push(seg)}return parts.join("/")}
async function relsOf(zip,path){
  const parts=path.split("/");const name=parts.pop();const rp=parts.join("/")+"/_rels/"+name+".rels";
  const f=zip.file(rp);if(!f)return {};
  const doc=new DOMParser().parseFromString(await f.async("string"),"application/xml");
  const out={};[...doc.getElementsByTagName("Relationship")].forEach(r=>out[r.getAttribute("Id")]={target:resolvePath(path,r.getAttribute("Target")),type:r.getAttribute("Type")||""});
  return out;
}
async function extractImages(zip){
  const wbDoc=new DOMParser().parseFromString(await zip.file("xl/workbook.xml").async("string"),"application/xml");
  const firstSheet=wbDoc.getElementsByTagNameNS("*","sheet")[0];
  const rid=firstSheet.getAttribute("r:id")||firstSheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
  const wbRels=await relsOf(zip,"xl/workbook.xml");const sheetPath=wbRels[rid]?wbRels[rid].target:"xl/worksheets/sheet1.xml";
  const imgs={};
  const sRels=await relsOf(zip,sheetPath);
  const dr=Object.values(sRels).find(r=>/\/drawing$/.test(r.type));
  if(!dr||!zip.file(dr.target))return {imgs,sheetPath};
  const dRels=await relsOf(zip,dr.target);
  const doc=new DOMParser().parseFromString(await zip.file(dr.target).async("string"),"application/xml");
  const anchors=[...doc.getElementsByTagNameNS("*","oneCellAnchor"),...doc.getElementsByTagNameNS("*","twoCellAnchor"),...doc.getElementsByTagNameNS("*","absoluteAnchor")];
  for(const a of anchors){
    const from=a.getElementsByTagNameNS("*","from")[0];if(!from)continue;
    const row=+from.getElementsByTagNameNS("*","row")[0].textContent+1;
    const blip=a.getElementsByTagNameNS("*","blip")[0];if(!blip)continue;
    const emb=blip.getAttribute("r:embed")||blip.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","embed");
    const rel=dRels[emb];if(!rel||!zip.file(rel.target))continue;
    const ext=rel.target.split(".").pop().toLowerCase();
    if(!imgs[row])imgs[row]={buffer:await zip.file(rel.target).async("uint8array"),extension:ext};
  }
  return {imgs,sheetPath};
}
function openImport(){
  const root=$("#modalRoot");
  root.innerHTML='<div class="overlay"><div class="modal" role="dialog" aria-modal="true" style="width:min(480px,100%)"><header><h2>استيراد كالندر من Excel</h2><button type="button" class="icon-btn" id="imX" aria-label="إغلاق">✕</button></header>'+
   '<div class="content"><p style="margin:0" class="hint">ارفع ملف الكالندر بنفس تنسيق الشيت (Date، Time، Visual، Caption…). الصور والكابشن وروابط التصميم والمنصات كلها تنضاف.</p>'+
   '<label class="btn" for="imFile" style="justify-self:start;cursor:pointer">اختر ملف Excel</label><input type="file" id="imFile" accept=".xlsx" class="hidden">'+
   '<div id="imInfo" class="hint"></div></div>'+
   '<footer><button class="btn primary" id="imGo" disabled>استورد</button><button class="btn" id="imNo">إلغاء</button><span class="msg" id="imMsg"></span></footer></div></div>';
  const close=()=>root.innerHTML="";
  $("#imX").onclick=close;$("#imNo").onclick=close;
  let parsed=null;
  $("#imFile").onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    $("#imInfo").textContent="جاري قراءة الملف…";$("#imGo").disabled=true;
    try{
      parsed=await parseCalendarXlsx(f);
      if(!parsed.length)throw new Error("ما لقيت بوستات في الملف");
      const ds=parsed.map(p=>p.date).sort();
      const dup=parsed.filter(p=>S.posts.some(x=>x.date===p.date&&x.time===p.time&&p.time)).length;
      $("#imInfo").innerHTML="<b>"+esc(f.name)+"</b><br>"+parsed.length+" بوست من "+shortDate(ds[0])+" لين "+shortDate(ds[ds.length-1])+" · "+parsed.filter(p=>p.img).length+" صورة"+(dup?'<br><span style="color:var(--warn)">تنبيه: '+dup+' بوست لها نفس اليوم والوقت لبوستات موجودة، بتنضاف كنسخ جديدة.</span>':"");
      $("#imGo").disabled=false;
    }catch(err){$("#imInfo").textContent="ما قدرت أقرا الملف: "+(err.message||err)}
  };
  $("#imGo").onclick=async()=>{
    $("#imGo").disabled=true;let i=0;
    try{
      for(const p of parsed){
        i++;$("#imMsg").textContent="جاري الاستيراد "+i+" من "+parsed.length+"…";
        const media=[];
        if(p.img){
          const ext=(p.img.extension||"png").replace("jpeg","jpg");
          const path=p.date.slice(0,7)+"/"+crypto.randomUUID()+"."+ext;
          const blob=new Blob([p.img.buffer],{type:ext==="jpg"?"image/jpeg":"image/"+ext});
          const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type});
          if(!error)media.push({path,type:"image"});
        }
        const row={date:p.date,time:p.time,caption:p.caption,media,design:p.design,animation:p.animation,links:p.links,landing:"",note:""};
        const {error}=await sb.from("posts").insert(row);if(error)throw error;
      }
      close();toast("انضاف "+parsed.length+" بوست");
      S.ym=parsed.map(p=>p.date).sort()[0].slice(0,7);await loadPosts(false);
    }catch(err){$("#imGo").disabled=false;$("#imMsg").textContent="وقف عند "+i+": "+(err.message||err)}
  };
}
